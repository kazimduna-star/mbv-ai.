<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Blob Arena</title>
<style>
:root{color-scheme:dark;--ip:env(safe-area-inset-top,0px);--ib:env(safe-area-inset-bottom,0px);--ui:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1240;color:#f4f7ff;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s,filter .15s}
button:active{transform:scale(.93)}
body.inmenu #hud,body.inmenu #lb,body.inmenu #btns,body.inmenu #gear,body.inmenu #dHud,body.inmenu #fpsHud{display:none}
body:not(.inmenu) #menu{display:none}
#menu{position:fixed;inset:0;z-index:20;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#3a5ae0,#1a2a80 50%,#0b1245)}
#menu:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff12 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,#ffffff12 1px,transparent 1px) 0 0/34px 34px}
.dot{position:absolute;border-radius:50%;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(16px,-24px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sh{0%,60%{left:-60%}100%{left:140%}}
@keyframes pl{50%{box-shadow:0 0 0 10px #4be36a00,0 0 18px #4be36a}}
@keyframes tx{to{background-position:250% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.94)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(56px,9vmin,84px);height:clamp(56px,9vmin,84px);border-radius:16px;font-size:10px;font-weight:800;text-shadow:0 2px 0 #0006;border:2px solid #ffffff55;box-shadow:inset 0 -5px 0 #0004,inset 0 2px 0 #fff5,0 6px 14px #0006;animation:up .5s both}
.tile i{font-style:normal;font-size:clamp(20px,4.6vmin,30px)}
.pu{background:linear-gradient(#bc8cff,#7a3fe0)}.gr{background:linear-gradient(#52e05c,#1a9c2c)}.bl{background:linear-gradient(#4aa3ff,#1550d6)}.ye{background:linear-gradient(#ffd24a,#e59a00)}
#tl{position:absolute;left:12px;top:calc(10px + var(--ip));display:flex;gap:10px;z-index:2}
#tr{position:absolute;right:12px;top:calc(12px + var(--ip));z-index:2}
.pill{display:flex;gap:8px;padding:6px 14px;border-radius:14px;background:#fff;color:#16205a;font-weight:900;border:2px solid #9ccfff}
#mid{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);width:min(860px,94vw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vmin,12px);padding:var(--ip) 0 var(--ib);z-index:2}
h1{margin:0;font-size:clamp(28px,9vmin,60px);font-weight:900;background:linear-gradient(90deg,#ffb020,#fff3b0,#ff7a1a,#ffb020) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx 5s linear infinite;filter:drop-shadow(0 4px 0 #8a4a00) drop-shadow(0 0 18px #ffb02088)}
#av{position:relative;width:clamp(84px,24vmin,150px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 30px #8a5cffaa;cursor:pointer;isolation:isolate;overflow:visible}
#av:before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(#ffb020,#ff4e9b,#7a3cff,#35e5c8,#ffb020);animation:spin 6s linear infinite;z-index:-1;filter:blur(2px)}
#av div,#av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 35%;display:block}
#nm{display:flex;background:#f2f4fb;border-radius:20px;width:min(300px,70vw);padding:0 10px}
#nm input{flex:1;min-width:0;background:none;border:0;outline:0;color:#16205a;font:800 16px system-ui,sans-serif;text-align:center;padding:9px 4px;user-select:text;-webkit-user-select:text}
#nm button{background:none;color:#556}
#onl{font-size:12px;color:#cfe0ff}#onl:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#35e57a;margin-right:6px}
#cards{display:flex;gap:clamp(8px,2vmin,18px);width:100%;justify-content:center;padding:0 8px}
.card{flex:1 1 0;max-width:230px;height:clamp(84px,21vmin,148px);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;font-weight:900;font-size:clamp(12px,3vmin,22px);text-shadow:0 2px 0 #0008;border:2px solid #ffffff55;box-shadow:inset 0 -8px 0 #0004,inset 0 3px 0 #fff4,0 10px 22px #0007;position:relative;overflow:hidden;line-height:1.1;animation:up .55s both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card i{position:absolute;top:8%;font-style:normal;font-size:clamp(28px,9vmin,60px)}
.card small{font-size:.55em;font-weight:700;opacity:.9;margin-top:3px}
.card:before{content:"";position:absolute;top:-30%;left:-60%;width:30%;height:160%;background:#fff3;transform:rotate(20deg);animation:sh 4s infinite}
.c0{background:linear-gradient(#b0703a,#5a2a0e)}.c1{background:linear-gradient(#b445ff,#5a14b8)}.c2{background:linear-gradient(#ffd04a,#f28a00)}
#hint{font-size:11px;color:#b9ceff;text-align:center;padding:0 10px}
@media(max-height:420px){#hint{display:none}}
@media(max-width:640px){#tr{display:none}.tile{width:54px;height:54px}.card small{display:none}}
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#050a22e6;backdrop-filter:blur(8px)}
.sheet{width:min(620px,96vw);max-height:92vh;display:flex;flex-direction:column;background:linear-gradient(#1b2a7a,#101a52);border:2px solid #7aa8ff55;border-radius:22px;box-shadow:0 20px 60px #000a;animation:pop .2s}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:18px;font-weight:900}
.sb{overflow:auto;padding:0 14px 12px;touch-action:pan-y;overscroll-behavior:contain}
.sf{padding:8px 12px 12px;display:flex;justify-content:flex-end}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff14}
.row small{display:block;color:#93a4c8;font-weight:600;font-size:11px}
.rg{display:flex;align-items:center;gap:8px;width:48%;font-size:12px}.rg input{flex:1;min-width:0;accent-color:#2ecc71}
.tg{width:48px;height:27px;border-radius:20px;background:#3a4a8a;position:relative;flex:none}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#cfd8ff;transition:.2s}
.tg.on{background:#2ecc71}.tg.on:after{left:24px;background:#fff}
.seg{display:flex;gap:4px}.seg button{padding:8px 12px;border-radius:9px;background:#2a3a8f}.seg button.on{background:#2ecc71}
select{background:#2a3a8f;color:#fff;border:1px solid #6a7ad0;border-radius:10px;padding:8px}
.gt{color:#7ad0ff;font-size:11px;font-weight:900;letter-spacing:2px;padding:14px 0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.sk{padding:8px 4px;border-radius:16px;background:#ffffff12;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#fff}
.sk.on{border-color:#ffd24a;background:#ffd24a22}
.sk span{width:46px;height:46px;border-radius:50%;border:2px solid #fff;overflow:hidden}.sk img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.btn{padding:12px 18px;border-radius:14px;background:#2a3a8f;font-weight:800;margin:4px}.btn.pr{background:linear-gradient(#52e05c,#1a9c2c)}
.x{width:36px;height:36px;border-radius:11px;background:#ffffff1c;font-size:16px}
#hud{position:fixed;left:12px;top:calc(10px + var(--ip));z-index:4;pointer-events:none;transform:scale(var(--ui));transform-origin:0 0}
#hud span{background:#0d1850cc;border:1px solid #ffffff2a;border-radius:12px;padding:7px 12px;display:inline-block}
#lb{position:fixed;right:10px;top:calc(10px + var(--ip));z-index:4;pointer-events:none;background:#0d1850cc;border:1px solid #ffffff2a;border-radius:14px;padding:8px 12px;min-width:130px;font-size:12px;transform:scale(var(--ui));transform-origin:100% 0}
#lb b{display:block;text-align:center;color:#ffd24a;margin-bottom:3px}#lb div{display:flex;justify-content:space-between;gap:10px}#lb .me{color:#ffd24a}
#fpsHud,#dHud{position:fixed;z-index:4;pointer-events:none;font-size:10px;font-weight:800;color:#ffd76a;background:#0d1850cc;padding:5px 9px;border-radius:9px;display:none}
#mgear{position:fixed;left:12px;top:calc(104px + var(--ip));z-index:5;width:42px;height:42px;border-radius:13px;background:linear-gradient(#bc8cff,#7a3fe0);border:1px solid #ffffff44;font-size:19px}body.inmenu #mgear{display:none}
#fpsHud{left:12px;top:calc(156px + var(--ip));color:#9fcaff}
#dHud{left:50%;top:calc(10px + var(--ip));transform:translateX(-50%)}
#btns{position:fixed;right:14px;bottom:calc(16px + var(--ib));z-index:5;display:grid;grid-template-columns:repeat(2,58px);gap:10px;transform:scale(var(--ui));transform-origin:100% 100%}
body.lh #btns{right:auto;left:14px;transform-origin:0 100%}
#btns button{height:58px;border-radius:18px;font-size:11px;font-weight:900;color:#fff;border:1px solid #ffffff66;box-shadow:0 5px 14px #0008,inset 0 2px 1px #ffffff66;text-shadow:0 1px 2px #0008}
#bs{background:linear-gradient(#58a6ff,#1f6feb)}#be{background:linear-gradient(#ffad55,#d65b00)}#bm{background:linear-gradient(#bc8cff,#7a3fe0)}#b5{background:linear-gradient(#ffe17b,#bf8700)}
#bm.on{background:linear-gradient(#4be36a,#139a3a);animation:pl 1s infinite}
#gear{position:fixed;left:12px;top:calc(56px + var(--ip));z-index:5;width:42px;height:42px;border-radius:13px;background:#1b2a7acc;border:1px solid #ffffff44;font-size:19px}
#joy{position:fixed;border-radius:50%;border:2px solid #ffffff66;background:#ffffff10;pointer-events:none;z-index:3;display:none}
#knob{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#a6d6ff 45%,#368cff);box-shadow:0 3px 14px #168cff99}
#end{position:fixed;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,90vw);padding:22px;text-align:center;background:linear-gradient(#1b2a7a,#101a52);border:2px solid #7aa8ff55;border-radius:22px;display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--ib));transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:12px;z-index:60;display:none}
.gif{position:fixed;display:none;z-index:2;border-radius:50%;object-fit:cover;object-position:center 35%;border:2px solid #ffe5ef;box-shadow:0 0 14px #ff80b7;pointer-events:none}
