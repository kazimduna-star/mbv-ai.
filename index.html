
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBV AI — Animagine XL 3.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0913;color:#f7f2ff;font-family:system-ui,sans-serif}
header{padding:18px 20px;background:#120d20;border-bottom:1px solid #332344}
.logo{font-size:26px;font-weight:900}.logo span{color:#a78bfa}
main{max-width:720px;margin:auto;padding:22px 15px}
h1{font-size:clamp(28px,7vw,42px);text-align:center}
.sub{text-align:center;color:#b8abc9;line-height:1.5}
.card{background:#171323;border:1px solid #352746;border-radius:18px;padding:18px;margin-top:22px}
label{display:block;margin:15px 0 8px;font-weight:700}
textarea,select{width:100%;background:#0d0a16;color:white;border:1px solid #49365e;border-radius:11px;padding:13px;font:inherit}
textarea{min-height:125px;resize:vertical}
button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:linear-gradient(100deg,#7c3aed,#c026d3);color:white;font-weight:800;font-size:16px}
button:disabled{opacity:.55}
#status{color:#d4c2ff;font-size:14px;line-height:1.6;margin-top:15px;overflow-wrap:anywhere}
img{width:100%;height:auto;display:block;margin-top:15px;border-radius:12px}
a{color:#c4b5fd}
.note{font-size:12px;color:#9e92b1;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<header><div class="logo">MBV <span>AI</span></div></header>
<main>
<h1>Animagine XL 3.1</h1>
<p class="sub">Создавай аниме-иллюстрации по своему описанию.</p>

<div class="card">
<label for="prompt">Описание изображения</label>
<textarea id="prompt" placeholder="1girl, long black hair, blue eyes, anime, cherry blossoms, sunset, masterpiece, best quality"></textarea>

<label for="ratio">Формат</label>
<select id="ratio">
<option value="896 x 1152">Портрет</option>
<option value="1024 x 1024">Квадрат</option>
<option value="1152 x 896">Альбомный</option>
</select>

<label for="steps">Детализация</label>
<select id="steps">
<option value="20">Быстро</option>
<option value="28" selected>Стандарт</option>
<option value="35">Высокая</option>
</select>

<button id="generate">✨ Создать изображение</button>
<div id="status">Модель: Animagine XL 3.1. Введи описание.</div>
<div id="results"></div>

<p class="note">
Генерация выполняется сторонним сервером Hugging Face.
Он может быть занят, ограничивать запросы или менять API.
</p>
</div>
</main>

<script type="module">
import { Client } from
"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const $ = id => document.getElementById(id);

$("generate").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt) {
    $("status").textContent = "Сначала напиши описание изображения.";
    return;
  }

  const button = $("generate");
  button.disabled = true;
  $("results").replaceChildren();
  $("status").textContent = "Подключаю Animagine XL 3.1...";

  try {
    const client = await Client.connect("Asahina2K/animagine-xl-3.1");

    $("status").textContent = "Генерирую изображение...";

    const ratio = $("ratio").value;
    const [width, height] = ratio.split(" x ").map(Number);

    const result = await client.predict("/run", [
      prompt,
      "",
      0,
      width,
      height,
      7,
      Number($("steps").value),
      "Euler a",
      ratio,
      "(None)",
      "Standard v3.1",
      false,
      0.55,
      1.5,
      true
    ]);

    const images = result.data?.[0];
    const list = Array.isArray(images) ? images : [images];
    let count = 0;

    for (const item of list) {
      const url = typeof item === "string"
        ? item
        : item?.image?.url || item?.url || item?.path;

      if (!url) continue;

      const image = document.createElement("img");
      image.src = url;
      image.alt = "Результат Animagine XL 3.1";
      $("results").appendChild(image);

      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Открыть изображение";
      link.style.display = "block";
      link.style.marginTop = "10px";
      $("results").appendChild(link);
      count++;
    }

    if (!count) {
      throw new Error("Ответ API не содержит изображений в ожидаемом формате.");
    }

    $("status").textContent = "Готово! Изображение создано.";
  } catch (error) {
    console.error(error);
    $("status").textContent =
      "Ошибка подключения или генерации: " +
      (error.message || "сервер недоступен") +
      ". Проверь API Space.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
