
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MB WORLD 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#91c9e8;font-family:Arial;color:white;touch-action:none}
canvas{display:block;position:absolute;inset:0;z-index:0}
button{border:0;color:white;background:#263d5c;padding:13px 16px;border-radius:13px;font-weight:bold}
#top{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.panel{background:#101827dc;padding:11px 14px;border-radius:13px;border:1px solid #ffffff35;font-size:13px}
#load,#start{background:#1677ff}
#status{position:absolute;z-index:2;top:68px;left:50%;transform:translateX(-50%);background:#101827dc;padding:9px 13px;border-radius:12px;font-size:12px;max-width:90%;text-align:center}
#controls{position:absolute;z-index:3;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#joy{width:125px;height:125px;border-radius:50%;background:#172a4580;border:2px solid #ffffff70;position:relative;pointer-events:auto;touch-action:none}
#stick{width:53px;height:53px;border-radius:50%;background:#fff;position:absolute;left:34px;top:34px;box-shadow:0 3px 15px #0008}
#jump{width:76px;height:76px;border-radius:50%;background:#1685ffeb;border:2px solid #ffffff80;font-size:13px;pointer-events:auto;touch-action:none}
#hint{position:absolute;z-index:2;bottom:160px;left:50%;transform:translateX(-50%);background:#101827c9;padding:8px 12px;border-radius:10px;font-size:11px;white-space:nowrap}
#file{display:none}
#loading{position:absolute;inset:0;z-index:5;background:#101827;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:25px}
#loading p{color:#b8c8dc;line-height:1.5}
#loading small{color:#9eacc0}
#fatal{display:none;position:absolute;z-index:10;inset:0;background:#111827;color:white;padding:25px;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:15px}
#fatal.show{display:flex}
#fatal pre{font-size:11px;white-space:pre-wrap;word-break:break-word;color:#ffb7b7;max-height:35vh;overflow:auto}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
 }
}
</script>
</head>

<body>

<div id="top">
 <div class="panel"><b>MB WORLD 3D</b><br>20 × 20 METERS</div>
 <button id="load">ЗАГРУЗИТЬ VRM</button>
</div>

<div id="status">Нажми «Начать игру»</div>
<div id="hint">Джойстик — движение · Проведи пальцем — камера</div>

<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <button id="jump">ПРЫЖОК</button>
</div>

<input id="file" type="file" accept=".vrm">

<div id="loading">
 <h1>MB WORLD 3D</h1>
 <p>Твоя первая 3D-игра<br>Карта 20 × 20 метров<br>Вид от третьего лица</p>
 <button id="start">НАЧАТЬ ИГРУ</button>
 <small>Для запуска нужен интернет</small>
</div>

<div id="fatal">
 <h2>ОШИБКА ЗАПУСКА</h2>
 <p>Не удалось запустить 3D-движок.</p>
 <pre id="fatalText"></pre>
 <button onclick="location.reload()">ПЕРЕЗАПУСТИТЬ</button>
</div>

<script>
window.addEventListener('error',e=>{
 const box=document.getElementById('fatal');
 if(box){
  document.getElementById('fatalText').textContent=e.message||'Ошибка JavaScript';
  box.classList.add('show');
 }
});
window.addEventListener('unhandledrejection',e=>{
 const box=document.getElementById('fatal');
 if(box){
  document.getElementById('fatalText').textContent=String(e.reason);
  box.classList.add('show');
 }
});
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin} from '@pixiv/three-vrm';

const $=id=>document.getElementById(id);
const status=$('status');
const fileInput=$('file');

let scene,camera,renderer,player,vrm;
let clock=new THREE.Clock();
let started=false;
let joyX=0,joyY=0;
let velocityY=0;
let grounded=true;
let cameraAngle=0;
let cameraDistance=6;
let cameraTouch=null;
let previousX=0;
let mixer=null;

function message(t){status.textContent=t;}

function showError(error){
 console.error(error);
 $('fatalText').textContent=String(error?.stack||error);
 $('fatal').classList.add('show');
}

function material(color,roughness=1){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function createTree(x,z){
 const tree=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.18,1.3,8),
  material(0x80512d)
 );
 trunk.position.y=.65;
 trunk.castShadow=true;
 tree.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(.8,12,10),
  material(0x287d43)
 );
 leaves.position.y=1.65;
 leaves.scale.set(1,1.2,1);
 leaves.castShadow=true;
 tree.add(leaves);

 tree.position.set(x,0,z);
 scene.add(tree);
}

function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x91c9e8);
 scene.fog=new THREE.Fog(0x91c9e8,28,65);

 camera=new THREE.PerspectiveCamera(
  65,innerWidth/innerHeight,.1,100
 );

 renderer=new THREE.WebGLRenderer({
  antialias:false,
  alpha:false,
  powerPreference:'high-performance'
 });

 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 renderer.domElement.style.touchAction='none';
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x65804e,2));

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(-8,15,10);
 scene.add(sun);

 // Карта 20 на 20 метров
 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  material(0x65ad50)
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.03;
 scene.add(ground);

 const grid=new THREE.GridHelper(20,20,0xffffff,0x478c42);
 grid.position.y=.005;
 scene.add(grid);

 // Декоративные деревья
 [
  [-8,-7],[-7,7],[8,-7],[7,7],
  [-9,0],[9,0],[0,-9],[0,9],
  [-5,-9],[5,9],[-9,5],[9,-5]
 ].forEach(p=>createTree(p[0],p[1]));

 // Камни
 for(let i=0;i<18;i++){
  const rock=new THREE.Mesh(
   new THREE.DodecahedronGeometry(.2+Math.random()*.25),
   material(0x929b9e)
  );
  rock.position.set(
   (Math.random()-.5)*17,
   .15,
   (Math.random()-.5)*17
  );
  scene.add(rock);
 }

 // Временный персонаж
 player=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.35,.8,5,10),
  material(0x287bff)
 );
 body.position.y=.85;
 player.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.27,16,16),
  material(0xffd1b0)
 );
 head.position.y=1.55;
 player.add(head);

 scene.add(player);

 camera.position.set(0,3,7);
 camera.lookAt(0,1,0);
}

function startGame(){
 if(started)return;
 started=true;

 try{
  message('Создаю игровой мир...');
  createWorld();
  $('loading').style.display='none';
  message('Мир готов! Загрузи своего персонажа.');
  animate();
 }catch(e){
  showError(e);
 }
}

// Загрузка VRM
async function loadCharacter(file){
 if(!file)return;

 if(!file.name.toLowerCase().endsWith('.vrm')){
  message('Нужен файл с расширением .vrm');
  return;
 }

 message('Загружаю 3D-персонажа...');

 try{
  const loader=new GLTFLoader();
  loader.crossOrigin='anonymous';
  loader.register(parser=>new VRMLoaderPlugin(parser));

  const buffer=await file.arrayBuffer();
  const gltf=await loader.parseAsync(buffer,'');

  const newVrm=gltf.userData.vrm;
  if(!newVrm)throw new Error('Не удалось распознать VRM');

  if(vrm)scene.remove(vrm.scene);
  else if(player)scene.remove(player);

  vrm=newVrm;
  player=vrm.scene;

  player.position.set(0,0,0);
  player.rotation.set(0,Math.PI,0);

  // Подгоняем размер персонажа
  const box=new THREE.Box3().setFromObject(player);
  const size=box.getSize(new THREE.Vector3());
  const height=size.y;

  if(height>0){
   player.scale.setScalar(1.7/height);
  }

  player.traverse(obj=>{
   if(obj.isMesh){
    obj.frustumCulled=false;
   }
  });

  scene.add(player);

  if(gltf.animations && gltf.animations.length){
   mixer=new THREE.AnimationMixer(player);
   gltf.animations.forEach(clip=>{
    mixer.clipAction(clip).play();
   });
  }

  message('Персонаж загружен! Можно играть.');
 }catch(e){
  console.error(e);
  message('Ошибка VRM: '+(e.message||'неизвестная ошибка'));
 }
}

// Джойстик
const joy=$('joy');
const stick=$('stick');
let joyActive=false;

function updateJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=37;
 const length=Math.hypot(x,y);

 if(length>max){
  x=x/length*max;
  y=y/length*max;
 }

 joyX=x/max;
 joyY=y/max;
 stick.style.left=(34+x)+'px';
 stick.style.top=(34+y)+'px';
}

joy.addEventListener('pointerdown',e=>{
 e.preventDefault();
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 updateJoy(e);
});

joy.addEventListener('pointermove',e=>{
 if(joyActive)updateJoy(e);
});

function resetJoy(){
 joyActive=false;
 joyX=0;
 joyY=0;
 stick.style.left='34px';
 stick.style.top='34px';
}

joy.addEventListener('pointerup',resetJoy);
joy.addEventListener('pointercancel',resetJoy);

// Прыжок
$('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(grounded){
  velocityY=6.5;
  grounded=false;
 }
});

// Управление камерой
function cameraStart(e){
 cameraTouch=e.pointerId;
 previousX=e.clientX;
 renderer.domElement.setPointerCapture(e.pointerId);
}
function cameraMove(e){
 if(cameraTouch!==e.pointerId)return;
 const dx=e.clientX-previousX;
 previousX=e.clientX;
 cameraAngle-=dx*.006;
}
function cameraEnd(e){
 if(cameraTouch===e.pointerId)cameraTouch=null;
}

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(player){
  const forward=new THREE.Vector3(
   -Math.sin(cameraAngle),0,-Math.cos(cameraAngle)
  );
  const right=new THREE.Vector3(
   Math.cos(cameraAngle),0,-Math.sin(cameraAngle)
  );

  const direction=new THREE.Vector3()
   .addScaledVector(right,joyX)
   .addScaledVector(forward,-joyY);

  const moving=direction.lengthSq()>.04;

  if(moving){
   direction.normalize();
   player.position.addScaledVector(direction,3.5*dt);

   const angle=Math.atan2(direction.x,direction.z);
   let diff=angle-player.rotation.y;
   diff=Math.atan2(Math.sin(diff),Math.cos(diff));
   player.rotation.y+=diff*Math.min(1,dt*10);
  }

  // Границы карты
  player.position.x=THREE.MathUtils.clamp(player.position.x,-9.5,9.5);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-9.5,9.5);

  // Прыжок
  player.position.y+=velocityY*dt;
  velocityY-=15*dt;

  if(player.position.y<=0){
   player.position.y=0;
   velocityY=0;
   grounded=true;
  }

  if(!vrm && moving && grounded){
   player.children[0].position.y=.85+Math.sin(performance.now()*.012)*.04;
  }

  if(vrm)vrm.update(dt);
  if(mixer)mixer.update(dt);

  // Камера от третьего лица
  const target=new THREE.Vector3(
   player.position.x,
   player.position.y+1.2,
   player.position.z
  );

  const offset=new THREE.Vector3(
   Math.sin(cameraAngle)*cameraDistance,
   3,
   Math.cos(cameraAngle)*cameraDistance
  );

  camera.position.lerp(
   target.clone().add(offset),
   Math.min(1,dt*5)
  );
  camera.lookAt(target);
 }

 renderer.render(scene,camera);
}

// События запуска
$('start').addEventListener('click',startGame);
$('load').addEventListener('click',()=>{
 if(!started){
  message('Сначала нажми «Начать игру»');
  return;
 }
 fileInput.click();
});

fileInput.addEventListener('change',async()=>{
 await loadCharacter(fileInput.files[0]);
 fileInput.value='';
});

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

try{
 message('3D-движок загружается...');
}catch(e){
 showError(e);
}

renderer?.domElement.addEventListener('pointerdown',cameraStart);
renderer?.domElement.addEventListener('pointermove',cameraMove);
renderer?.domElement.addEventListener('pointerup',cameraEnd);
renderer?.domElement.addEventListener('pointercancel',cameraEnd);

</script>
</body>
</html>
