
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE ARENA 11.0 PC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050914;color:white;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#top{
position:fixed;top:14px;left:50%;transform:translateX(-50%);
font-size:19px;font-weight:900;letter-spacing:2px;
text-shadow:0 0 15px #00c8ff;pointer-events:none;z-index:3
}
#hud{position:fixed;top:18px;left:20px;z-index:4;font-weight:bold;
background:#101b2bd9;padding:14px 18px;border:1px solid #263b55;border-radius:12px;line-height:1.8}
#controls{position:fixed;right:20px;top:18px;display:flex;gap:8px;z-index:5}
button{background:#17263a;color:white;border:1px solid #38516d;
border-radius:9px;padding:11px 17px;font-weight:bold;cursor:pointer}
button:hover{background:#245078}
#menu,#over{
position:fixed;inset:0;z-index:10;display:flex;align-items:center;
justify-content:center;background:#030814d9;backdrop-filter:blur(8px)
}
.panel{width:440px;max-width:92vw;background:#101b2c;border:1px solid #304866;
border-radius:20px;padding:30px;text-align:center;box-shadow:0 0 60px #0077ff30}
h1{font-size:36px;margin:0 0 8px;color:#42d7ff}
.sub{color:#9db2cc;margin-bottom:22px}
#play{width:100%;font-size:20px;padding:16px;background:#087ed1;margin:15px 0}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.skin{height:43px;border:2px solid #52657d;border-radius:9px;cursor:pointer}
.skin.selected{border:3px solid white;box-shadow:0 0 14px #45dfff}
#skinLabel{margin-top:15px;color:#9db2cc}
#over{display:none}
#over h1{color:#ff536a}
#bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
color:#8499b3;font-size:12px;pointer-events:none}
#leader{position:fixed;right:20px;top:90px;background:#101b2bd9;
border:1px solid #263b55;border-radius:12px;padding:14px 18px;
min-width:180px;z-index:3;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top">МАРАТ АЛИЕВ • 1 КУРС</div>
<div id="hud">
<div>🏆 SNAKE ARENA</div>
<div>Масса: <span id="mass">100</span></div>
<div>Длина: <span id="length">55</span></div>
<div>Ботов: <span id="bots">0</span></div>
</div>
<div id="controls">
<button onclick="changeZoom(1.15)">ZOOM +</button>
<button onclick="changeZoom(.87)">ZOOM −</button>
<button onclick="togglePause()">ESC ПАУЗА</button>
</div>
<div id="leader"><b>ТОП ИГРОКОВ</b><div id="scores"></div></div>
<div id="bottom">МЫШЬ / WASD — ДВИЖЕНИЕ · SHIFT — УСКОРЕНИЕ · КОЛЁСИКО — ЗУМ</div>

<div id="menu">
<div class="panel">
<h1>SNAKE ARENA</h1>
<div class="sub">PC EDITION • VERSION 11.0</div>
<p>Выбери внешний вид змейки</p>
<div class="skins" id="skins"></div>
<div id="skinLabel">Выбран: Красный</div>
<button id="play" onclick="startGame()">ИГРАТЬ</button>
<div class="sub">Мышь — управление · Shift — ускорение</div>
</div>
</div>

<div id="over">
<div class="panel">
<h1>ТЫ ПОГИБ!</h1>
<p id="result">Твоя змейка проиграла.</p>
<button id="play" onclick="restartGame()">ИГРАТЬ СНОВА</button>
<button onclick="backMenu()" style="width:100%">В МЕНЮ</button>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W,H,dpr;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

const WORLD=5000, FOOD_COUNT=1500, BOT_COUNT=35;
const skins=[
{name:'Красный',color:'#ff354f'},
{name:'Синий',color:'#258bff'},
{name:'Зелёный',color:'#28dc91'},
{name:'Фиолетовый',color:'#a45aff'},
{name:'Золотой',color:'#ffc83d'},
{name:'Ледяной',color:'#70eaff'},
{name:'Радужный',color:'rainbow'},
{name:'Огненный',color:'fire'}
];
let selectedSkin=0;
const skinBox=document.getElementById('skins');
skins.forEach((s,i)=>{
 let b=document.createElement('div');
 b.className='skin'+(i===0?' selected':'');
 b.style.background=s.color==='rainbow'?
 'linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet)':
 s.color==='fire'?'linear-gradient(90deg,#ffeb3b,#ff6b00,#e60035)':s.color;
 b.title=s.name;
 b.onclick=()=>{
  selectedSkin=i;
  document.querySelectorAll('.skin').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  document.getElementById('skinLabel').textContent='Выбран: '+s.name;
 };
 skinBox.appendChild(b);
});

let foods=[],snakes=[],player=null,running=false,paused=false;
let camera={x:0,y:0,zoom:1},manualZoom=1;
let mouse={x:W/2,y:H/2};
let keys={};
let last=0,foodId=0;

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}

function makeSnake(x,y,isPlayer=false,index=0){
 let angle=rand(0,Math.PI*2);
 let s={
  x,y,angle,points:[],mass:isPlayer?100:rand(180,600),
  speed:0,alive:true,isPlayer,index,
  color:isPlayer?skins[selectedSkin].color:
  ['#ff465e','#33aaff','#a65cff','#42e6a4','#ffbd39','#f078e8'][index%6],
  hue:rand(0,360),boost:false,name:isPlayer?'МАРАТ':'БОТ '+(index+1)
 };
 let count=55;
 for(let i=0;i<count;i++){
  s.points.push({x:x-Math.cos(angle)*i*7,y:y-Math.sin(angle)*i*7});
 }
 return s;
}

function addFood(x,y,value){
 foods.push({x,y,v:value||rand(2,7),r:rand(3,6),h:rand(0,360)});
}
function spawnFood(){
 foods=[];
 for(let i=0;i<FOOD_COUNT;i++)addFood(rand(-WORLD/2,WORLD/2),rand(-WORLD/2,WORLD/2));
}
function spawnBots(){
 snakes=[player];
 for(let i=0;i<BOT_COUNT;i++){
  let a=rand(0,Math.PI*2),r=rand(500,2200);
  snakes.push(makeSnake(Math.cos(a)*r,Math.sin(a)*r,false,i));
 }
}

function startGame(){
 document.getElementById('menu').style.display='none';
 document.getElementById('over').style.display='none';
 player=makeSnake(0,0,true);
 spawnFood();spawnBots();
 camera.x=0;camera.y=0;manualZoom=1;
 running=true;paused=false;last=performance.now();
}
function restartGame(){startGame()}
function backMenu(){
 running=false;
 document.getElementById('over').style.display='none';
 document.getElementById('menu').style.display='flex';
}
function togglePause(){
 if(!running)return;
 paused=!paused;
}
function changeZoom(v){manualZoom=clamp(manualZoom*v,.35,2.5)}

addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='Escape')togglePause();
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('wheel',e=>{
 e.preventDefault();changeZoom(e.deltaY<0?1.1:.9);
},{passive:false});

function die(s){
 if(!s.alive)return;
 s.alive=false;
 for(let i=5;i<s.points.length;i+=3){
  let p=s.points[i];addFood(p.x+rand(-8,8),p.y+rand(-8,8),rand(5,12));
 }
 if(s.isPlayer){
  running=false;
  document.getElementById('result').textContent='Твоя масса: '+Math.floor(s.mass);
  document.getElementById('over').style.display='flex';
 }
}

function moveSnake(s,dt){
 if(!s.alive)return;
 if(s.isPlayer){
  let target=Math.atan2(mouse.y-H/2,mouse.x-W/2);
  if(keys['a']||keys['arrowleft'])target=s.angle-.07;
  if(keys['d']||keys['arrowright'])target=s.angle+.07;
  if(keys['w']||keys['arrowup'])target=s.angle;
  if(keys['s']||keys['arrowdown'])target=s.angle+Math.PI;
  let diff=angleDiff(s.angle,target);
  s.angle+=clamp(diff,-3.4*dt,3.4*dt);
  s.boost=!!(keys['shift']&&s.mass>25);
 }else{
  if(Math.random()<.025)s.angle+=rand(-1.3,1.3);
  let target=s.angle;
  let nearest=null,nd=Infinity;
  for(let f of foods){
   let d=Math.hypot(f.x-s.x,f.y-s.y);
   if(d<nd&&d<350){nd=d;nearest=f}
  }
  if(nearest){
   let a=Math.atan2(nearest.y-s.y,nearest.x-s.x);
   s.angle+=clamp(angleDiff(s.angle,a),-1.7*dt,1.7*dt);
  }
  if(Math.random()<.012)s.boost=s.mass>100&&Math.random()<.5;
 }
 let speed= s.boost?310:190;
 speed*=1/(1+s.mass/4500);
 s.x+=Math.cos(s.angle)*speed*dt;
 s.y+=Math.sin(s.angle)*speed*dt;
 if(Math.abs(s.x)>WORLD/2||Math.abs(s.y)>WORLD/2){die(s);return}
 s.points.unshift({x:s.x,y:s.y});
 let spacing=7;
 let length=55+Math.sqrt(s.mass)*3.4;
 while(s.points.length>length)s.points.pop();
}

function eatFood(){
 for(let s of snakes){
  if(!s.alive)continue;
  for(let i=foods.length-1;i>=0;i--){
   let f=foods[i];
   if(Math.hypot(s.x-f.x,s.y-f.y)<20+f.r){
    s.mass+=f.v*1.2;
    foods.splice(i,1);
   }
  }
 }
 while(foods.length<FOOD_COUNT)addFood(rand(-WORLD/2,WORLD/2),rand(-WORLD/2,WORLD/2));
}

function collisions(){
 for(let i=0;i<snakes.length;i++){
  let a=snakes[i];if(!a.alive)continue;
  for(let j=i+1;j<snakes.length;j++){
   let b=snakes[j];if(!b.alive)continue;
   let hitA=false,hitB=false;
   for(let k=5;k<b.points.length;k+=2){
    if(Math.hypot(a.x-b.points[k].x,a.y-b.points[k].y)<17){hitA=true;break}
   }
   for(let k=5;k<a.points.length;k+=2){
    if(Math.hypot(b.x-a.points[k].x,b.y-a.points[k].y)<17){hitB=true;break}
   }
   if(Math.hypot(a.x-b.x,a.y-b.y)<22){hitA=true;hitB=true}
   if(hitA||hitB){die(a);die(b)}
  }
 }
}

function update(dt){
 for(let s of snakes)moveSnake(s,dt);
 eatFood();collisions();
 for(let i=1;i<snakes.length;i++){
  if(!snakes[i].alive){
   let a=rand(0,Math.PI*2),r=rand(600,2200);
   snakes[i]=makeSnake(Math.cos(a)*r,Math.sin(a)*r,false,i);
  }
 }
 if(player&&player.alive){
  camera.x+=(player.x-camera.x)*Math.min(1,dt*5);
  camera.y+=(player.y-camera.y)*Math.min(1,dt*5);
 }
}

function worldToScreen(x,y){
 return {x:(x-camera.x)*camera.zoom+W/2,y:(y-camera.y)*camera.zoom+H/2};
}
function drawBackground(){
 ctx.fillStyle='#07101e';ctx.fillRect(0,0,W,H);
 let step=100*camera.zoom;
 if(step>15){
  let ox=((W/2-camera.x*camera.zoom)%step+step)%step;
  let oy=((H/2-camera.y*camera.zoom)%step+step)%step;
  ctx.strokeStyle='#15253a';ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=oy;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
 }
 let a=worldToScreen(-WORLD/2,-WORLD/2);
 let b=worldToScreen(WORLD/2,WORLD/2);
 ctx.strokeStyle='#ff3c61';ctx.lineWidth=5;
 ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
}

function foodColor(h){return `hsl(${h},100%,65%)`}
function drawFood(){
 for(let f of foods){
  let p=worldToScreen(f.x,f.y);
  if(p.x<-15||p.x>W+15||p.y<-15||p.y>H+15)continue;
  let r=Math.max(1.5,f.r*camera.zoom);
  ctx.fillStyle=foodColor(f.h);
  ctx.shadowBlur=10;ctx.shadowColor=foodColor(f.h);
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;
}

function drawSnake(s){
 if(!s.alive||s.points.length<2)return;
 let pts=s.points;
 let r=(8+Math.sqrt(s.mass)*.48)*camera.zoom;
 ctx.lineCap='round';ctx.lineJoin='round';
 let rainbow=s.color==='rainbow'||s.color==='fire';
 if(rainbow){
  for(let i=pts.length-1;i>0;i--){
   let a=worldToScreen(pts[i].x,pts[i].y);
   let b=worldToScreen(pts[i-1].x,pts[i-1].y);
   ctx.strokeStyle=s.color==='fire'?`hsl(${Math.max(0,45-i*.3)},100%,${55-i*.05}%)`:`hsl(${(i*5+s.hue)%360},100%,60%)`;
   ctx.lineWidth=r*2;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
 }else{
  ctx.strokeStyle=s.color;ctx.lineWidth=r*2;
  ctx.beginPath();
  let p=worldToScreen(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.moveTo(p.x,p.y);
  for(let i=pts.length-2;i>=0;i-=1){
   p=worldToScreen(pts[i].x,pts[i].y);ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
 }
 let head=worldToScreen(s.x,s.y);
 ctx.fillStyle=s.color==='rainbow'?'#ffec55':s.color==='fire'?'#ff9a25':s.color;
 ctx.beginPath();ctx.arc(head.x,head.y,r,0,Math.PI*2);ctx.fill();
 let ex=Math.cos(s.angle+Math.PI/2)*r*.42;
 let ey=Math.sin(s.angle+Math.PI/2)*r*.42;
 for(let side of [-1,1]){
  let x=head.x+Math.cos(s.angle)*r*.35+ex*side;
  let y=head.y+Math.sin(s.angle)*r*.35+ey*side;
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,r*.28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#10131a';ctx.beginPath();
  ctx.arc(x+Math.cos(s.angle)*r*.1,y+Math.sin(s.angle)*r*.1,r*.13,0,Math.PI*2);ctx.fill();
 }
 if(camera.zoom>.45){
  ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillStyle='white';
  ctx.fillText(s.name,head.x,head.y-r-9);
 }
}

function draw(){
 drawBackground();drawFood();
 for(let s of snakes)drawSnake(s);
}
function hud(){
 if(!player)return;
 document.getElementById('mass').textContent=Math.floor(player.mass);
 document.getElementById('length').textContent=player.points.length;
 document.getElementById('bots').textContent=snakes.filter(s=>!s.isPlayer&&s.alive).length;
 let top=[...snakes].filter(s=>s.alive).sort((a,b)=>b.mass-a.mass).slice(0,5);
 document.getElementById('scores').innerHTML=top.map((s,i)=>
 `${i+1}. ${s.name} — ${Math.floor(s.mass)}`
 ).join('<br>');
}
function loop(t){
 requestAnimationFrame(loop);
 let dt=Math.min((t-last)/1000,.04);last=t;
 if(running&&!paused){
  update(dt);
  if(player&&player.alive){
   let auto=clamp(1.25/(1+Math.sqrt(player.mass)/30),.48,1.15);
   camera.zoom+=(auto*manualZoom-camera.zoom)*Math.min(1,dt*2.5);
  }
  hud();
 }
 draw();
 if(paused&&running){
  ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 40px Arial';
  ctx.fillText('ПАУЗА',W/2,H/2);
 }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
