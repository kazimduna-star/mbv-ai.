
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNAKE ARENA 13.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:white;font-family:Arial}
#stage{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#07101e}
canvas{display:block;width:100%;height:100%}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;letter-spacing:2px;text-shadow:0 0 15px #00c8ff;pointer-events:none;white-space:nowrap}
#hud{position:absolute;top:14px;left:16px;background:#101b2bdd;border:1px solid #30445e;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7;font-weight:bold;pointer-events:none}
#leader{position:absolute;right:16px;top:72px;background:#101b2bdd;border:1px solid #30445e;border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.7;min-width:160px;pointer-events:none}
#controls{position:absolute;right:16px;top:14px;display:flex;gap:7px}
button{background:#172b42;color:white;border:1px solid #426080;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}
button:hover{background:#245078}
#bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#91a6c0;font-size:12px;white-space:nowrap;pointer-events:none}
#joystick{position:absolute;left:35px;bottom:35px;width:145px;height:145px;border-radius:50%;background:#13253b99;border:2px solid #52718e;touch-action:none;user-select:none}
#stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#4dbbff;border:3px solid white;box-shadow:0 0 20px #168cff;pointer-events:none}
#boost{position:absolute;right:40px;bottom:50px;width:105px;height:105px;border-radius:50%;background:linear-gradient(145deg,#ff9d28,#e83d28);border:3px solid #ffd19a;font-size:17px;box-shadow:0 0 22px #ff6b25;touch-action:none;user-select:none}
#boost.active{background:#ffdf54;color:#211400;transform:scale(.94)}
#menu,#over{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#030814df;backdrop-filter:blur(8px)}
.panel{width:430px;max-width:90%;background:#101b2c;border:1px solid #304866;border-radius:18px;padding:27px;text-align:center;box-shadow:0 0 60px #0077ff30}
h1{font-size:34px;margin:0 0 8px;color:#42d7ff}
.sub{color:#9db2cc;margin:12px 0}
#play{width:100%;font-size:19px;padding:15px;background:#087ed1;margin:15px 0}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.skin{height:38px;border:2px solid #52657d;border-radius:8px;cursor:pointer}
.skin.selected{border:3px solid white;box-shadow:0 0 14px #45dfff}
#skinLabel{margin-top:12px;color:#9db2cc}
#over{display:none}
#over h1{color:#ff536a}
@media(max-width:700px){
 #hud{font-size:10px;padding:6px}
 #leader{display:none}
 #top{font-size:12px}
 #controls button{font-size:9px;padding:6px}
 #joystick{width:110px;height:110px;left:12px;bottom:20px}
 #stick{width:46px;height:46px}
 #boost{width:75px;height:75px;right:15px;bottom:30px;font-size:13px}
 #bottom{display:none}
}
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>

<div id="top">МАРАТ АЛИЕВ • 1 КУРС</div>

<div id="hud">
<div>🐍 SNAKE ARENA</div>
<div>Масса: <span id="mass">100</span></div>
<div>Длина: <span id="length">38</span></div>
<div>Боты: <span id="bots">0</span></div>
</div>

<div id="controls">
<button onclick="changeZoom(1.15)">ZOOM +</button>
<button onclick="changeZoom(.87)">ZOOM −</button>
<button onclick="togglePause()">ESC / ПАУЗА</button>
</div>

<div id="leader"><b>ТОП ИГРОКОВ</b><div id="scores"></div></div>

<div id="joystick"><div id="stick"></div></div>
<button id="boost">BOOST</button>
<div id="bottom">ДЖОЙСТИК — ДВИЖЕНИЕ · BOOST — УСКОРЕНИЕ · КОЛЁСИКО — ЗУМ</div>

<div id="menu">
 <div class="panel">
  <h1>SNAKE ARENA</h1>
  <div class="sub">FULLSCREEN PC EDITION • 13.0</div>
  <p>Выбери скин змейки</p>
  <div class="skins" id="skins"></div>
  <div id="skinLabel">Выбран: Красный</div>
  <button id="play" onclick="startGame()">ИГРАТЬ</button>
  <div class="sub">Джойстик — движение · BOOST — ускорение</div>
 </div>
</div>

<div id="over">
 <div class="panel">
  <h1>ТЫ ПОГИБ!</h1>
  <p id="result"></p>
  <button id="play" onclick="startGame()">ИГРАТЬ СНОВА</button>
  <button onclick="backMenu()" style="width:100%">В МЕНЮ</button>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W,H,dpr=1;

function resize(){
 W=innerWidth;H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

const WORLD=6000;
const FOOD_COUNT=1300;
const BOT_COUNT=30;

const skins=[
 {name:'Красный',color:'#ff354f'},
 {name:'Синий',color:'#258bff'},
 {name:'Зелёный',color:'#28dc91'},
 {name:'Фиолетовый',color:'#a45aff'},
 {name:'Золотой',color:'#ffc83d'},
 {name:'Ледяной',color:'#70eaff'},
 {name:'Радужный',color:'rainbow'},
 {name:'Огненный',color:'fire'}
];

let selectedSkin=0;
const skinBox=document.getElementById('skins');

skins.forEach((s,i)=>{
 let b=document.createElement('div');
 b.className='skin'+(i===0?' selected':'');
 b.style.background=s.color==='rainbow'
 ?'linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet)'
 :s.color==='fire'
 ?'linear-gradient(90deg,#ffeb3b,#ff6b00,#e60035)':s.color;
 b.title=s.name;
 b.onclick=()=>{
  selectedSkin=i;
  document.querySelectorAll('.skin').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  document.getElementById('skinLabel').textContent='Выбран: '+s.name;
 };
 skinBox.appendChild(b);
});

let foods=[],snakes=[],player=null;
let running=false,paused=false;
let camera={x:0,y:0,zoom:1},manualZoom=1;
let last=0;
let joystick={active:false,x:0,y:0};
let boostActive=false;
let keys={};

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}

function makeSnake(x,y,isPlayer=false,index=0,mass=null){
 let angle=rand(0,Math.PI*2);
 let m=mass===null?(isPlayer?100:rand(75,145)):mass;
 let s={
  x,y,angle,points:[],mass:m,alive:true,isPlayer,index,
  color:isPlayer?skins[selectedSkin].color:
  ['#ff465e','#33aaff','#a65cff','#42e6a4','#ffbd39','#f078e8'][index%6],
  hue:rand(0,360),boost:false,
  name:isPlayer?'МАРАТ':'БОТ '+(index+1)
 };

 for(let i=0;i<38;i++){
  s.points.push({
   x:x-Math.cos(angle)*i*6,
   y:y-Math.sin(angle)*i*6
  });
 }
 return s;
}

function addFood(x,y,value){
 foods.push({x,y,v:value||rand(2,7),r:rand(3,6),h:rand(0,360)});
}

function spawnFood(){
 foods=[];
 for(let i=0;i<FOOD_COUNT;i++){
  addFood(rand(-WORLD/2,WORLD/2),rand(-WORLD/2,WORLD/2));
 }
}

function safeBotPosition(){
 let x,y,tries=0;
 do{
  let a=rand(0,Math.PI*2);
  let r=rand(1400,2400);
  x=player.x+Math.cos(a)*r;
  y=player.y+Math.sin(a)*r;
  tries++;
 }while((Math.abs(x)>WORLD/2-150||Math.abs(y)>WORLD/2-150)&&tries<30);

 return {
  x:clamp(x,-WORLD/2+200,WORLD/2-200),
  y:clamp(y,-WORLD/2+200,WORLD/2-200)
 };
}

function spawnBots(){
 snakes=[player];
 for(let i=0;i<BOT_COUNT;i++){
  let p=safeBotPosition();
  snakes.push(makeSnake(p.x,p.y,false,i,rand(75,145)));
 }
}

function startGame(){
 document.getElementById('menu').style.display='none';
 document.getElementById('over').style.display='none';
 player=makeSnake(0,0,true);
 spawnFood();
 spawnBots();
 camera={x:0,y:0,zoom:1};
 manualZoom=1;
 running=true;
 paused=false;
 last=performance.now();
}

function backMenu(){
 running=false;
 document.getElementById('over').style.display='none';
 document.getElementById('menu').style.display='flex';
}

function togglePause(){
 if(running)paused=!paused;
}

function changeZoom(v){
 manualZoom=clamp(manualZoom*v,.35,2.5);
}

// Джойстик
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');

function updateJoystick(e){
 let r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let max=r.width*.34;
 let d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 joystick.x=dx/max;
 joystick.y=dy/max;
 stick.style.left=`calc(50% + ${dx}px)`;
 stick.style.top=`calc(50% + ${dy}px)`;
}

joy.addEventListener('pointerdown',e=>{
 joystick.active=true;
 joy.setPointerCapture(e.pointerId);
 updateJoystick(e);
});
joy.addEventListener('pointermove',e=>{
 if(joystick.active)updateJoystick(e);
});
function releaseJoystick(){
 joystick.active=false;
 joystick.x=0;joystick.y=0;
 stick.style.left='50%';stick.style.top='50%';
}
joy.addEventListener('pointerup',releaseJoystick);
joy.addEventListener('pointercancel',releaseJoystick);

const boostButton=document.getElementById('boost');
boostButton.addEventListener('pointerdown',e=>{
 e.preventDefault();
 boostActive=true;
 boostButton.classList.add('active');
});
function releaseBoost(){
 boostActive=false;
 boostButton.classList.remove('active');
}
boostButton.addEventListener('pointerup',releaseBoost);
boostButton.addEventListener('pointerleave',releaseBoost);
boostButton.addEventListener('pointercancel',releaseBoost);

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='Escape')togglePause();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

addEventListener('wheel',e=>{
 changeZoom(e.deltaY<0?1.1:.9);
},{passive:true});

function die(s){
 if(!s.alive)return;
 s.alive=false;

 for(let i=5;i<s.points.length;i+=3){
  let p=s.points[i];
  addFood(p.x+rand(-8,8),p.y+rand(-8,8),rand(4,9));
 }

 if(s.isPlayer){
  running=false;
  document.getElementById('result').textContent='Твоя масса: '+Math.floor(s.mass);
  document.getElementById('over').style.display='flex';
 }
}

function moveSnake(s,dt){
 if(!s.alive)return;

 if(s.isPlayer){
  let dx=joystick.x,dy=joystick.y;

  if(keys['a']||keys['arrowleft'])dx=-1;
  if(keys['d']||keys['arrowright'])dx=1;
  if(keys['w']||keys['arrowup'])dy=-1;
  if(keys['s']||keys['arrowdown'])dy=1;

  if(Math.hypot(dx,dy)>.12){
   let target=Math.atan2(dy,dx);
   s.angle+=clamp(angleDiff(s.angle,target),-4.5*dt,4.5*dt);
  }
  s.boost=boostActive||keys['shift'];

 }else{
  if(Math.random()<.018)s.angle+=rand(-1,1);

  let nearest=null,nd=Infinity;
  for(let f of foods){
   let d=Math.hypot(f.x-s.x,f.y-s.y);
   if(d<nd&&d<320){nd=d;nearest=f}
  }
  if(nearest){
   let target=Math.atan2(nearest.y-s.y,nearest.x-s.x);
   s.angle+=clamp(angleDiff(s.angle,target),-1.7*dt,1.7*dt);
  }
  s.boost=false;
 }

 let speed=s.boost?300:185;
 speed*=1/(1+s.mass/5000);
 s.x+=Math.cos(s.angle)*speed*dt;
 s.y+=Math.sin(s.angle)*speed*dt;

 if(Math.abs(s.x)>WORLD/2||Math.abs(s.y)>WORLD/2){
  die(s);return;
 }

 s.points.unshift({x:s.x,y:s.y});
 let maxLength=42+Math.sqrt(s.mass)*1.8;
 while(s.points.length>maxLength)s.points.pop();
}

function eatFood(){
 for(let s of snakes){
  if(!s.alive)continue;
  for(let i=foods.length-1;i>=0;i--){
   let f=foods[i];
   if(Math.hypot(s.x-f.x,s.y-f.y)<19+f.r){
    s.mass+=f.v*1.2;
    foods.splice(i,1);
   }
  }
 }
 while(foods.length<FOOD_COUNT){
  addFood(rand(-WORLD/2,WORLD/2),rand(-WORLD/2,WORLD/2));
 }
}

function headHitsBody(head,body){
 for(let k=8;k<body.points.length;k+=2){
  let p=body.points[k];
  if(Math.hypot(head.x-p.x,head.y-p.y)<19)return true;
 }
 return false;
}

function collisions(){
 if(!player||!player.alive)return;

 // Бот врезается в игрока — погибает бот.
 // Игрок врезается в бота — погибает игрок.
 for(let i=1;i<snakes.length;i++){
  let bot=snakes[i];
  if(!bot.alive)continue;

  if(headHitsBody(bot,player)){
   die(bot);
   continue;
  }

  if(headHitsBody(player,bot)){
   die(player);
   return;
  }

  if(Math.hypot(player.x-bot.x,player.y-bot.y)<22){
   die(bot);
  }
 }

 // Столкновения ботов между собой
 for(let i=1;i<snakes.length;i++){
  let a=snakes[i];
  if(!a.alive)continue;

  for(let j=i+1;j<snakes.length;j++){
   let b=snakes[j];
   if(!b.alive)continue;

   if(headHitsBody(a,b)||headHitsBody(b,a)||
      Math.hypot(a.x-b.x,a.y-b.y)<22){
    die(a);
    die(b);
   }
  }
 }
}

function update(dt){
 for(let s of snakes)moveSnake(s,dt);
 eatFood();
 collisions();

 // Боты появляются заново далеко от игрока и с маленьким телом.
 for(let i=1;i<snakes.length;i++){
  if(!snakes[i].alive){
   let p=safeBotPosition();
   snakes[i]=makeSnake(p.x,p.y,false,i,rand(75,145));
  }
 }

 if(player&&player.alive){
  camera.x+=(player.x-camera.x)*Math.min(1,dt*5);
  camera.y+=(player.y-camera.y)*Math.min(1,dt*5);
 }
}

function worldToScreen(x,y){
 return {
  x:(x-camera.x)*camera.zoom+W/2,
  y:(y-camera.y)*camera.zoom+H/2
 };
}

function drawBackground(){
 ctx.fillStyle='#07101e';
 ctx.fillRect(0,0,W,H);

 let step=100*camera.zoom;
 if(step>12){
  let ox=((W/2-camera.x*camera.zoom)%step+step)%step;
  let oy=((H/2-camera.y*camera.zoom)%step+step)%step;
  ctx.strokeStyle='#15253a';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<W;x+=step){
   ctx.moveTo(x,0);ctx.lineTo(x,H);
  }
  for(let y=oy;y<H;y+=step){
   ctx.moveTo(0,y);ctx.lineTo(W,y);
  }
  ctx.stroke();
 }

 let a=worldToScreen(-WORLD/2,-WORLD/2);
 let b=worldToScreen(WORLD/2,WORLD/2);
 ctx.strokeStyle='#ff3c61';
 ctx.lineWidth=4;
 ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
}

function drawFood(){
 for(let f of foods){
  let p=worldToScreen(f.x,f.y);
  if(p.x<-15||p.x>W+15||p.y<-15||p.y>H+15)continue;
  let r=Math.max(1.5,f.r*camera.zoom);
  let c=`hsl(${f.h},100%,65%)`;
  ctx.fillStyle=c;
  ctx.shadowBlur=9;
  ctx.shadowColor=c;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();
 }
 ctx.shadowBlur=0;
}

function drawSnake(s){
 if(!s.alive||s.points.length<2)return;
 let pts=s.points;
 let r=(8+Math.sqrt(s.mass)*.48)*camera.zoom;
 ctx.lineCap='round';
 ctx.lineJoin='round';

 if(s.color==='rainbow'||s.color==='fire'){
  for(let i=pts.length-1;i>0;i--){
   let a=worldToScreen(pts[i].x,pts[i].y);
   let b=worldToScreen(pts[i-1].x,pts[i-1].y);
   ctx.strokeStyle=s.color==='fire'
    ?`hsl(${Math.max(0,45-i*.3)},100%,55%)`
    :`hsl(${(i*5+s.hue)%360},100%,60%)`;
   ctx.lineWidth=r*2;
   ctx.beginPath();
   ctx.moveTo(a.x,a.y);
   ctx.lineTo(b.x,b.y);
   ctx.stroke();
  }
 }else{
  ctx.strokeStyle=s.color;
  ctx.lineWidth=r*2;
  ctx.beginPath();
  let p=worldToScreen(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.moveTo(p.x,p.y);
  for(let i=pts.length-2;i>=0;i--){
   p=worldToScreen(pts[i].x,pts[i].y);
   ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
 }

 let head=worldToScreen(s.x,s.y);
 ctx.fillStyle=s.color==='rainbow'?'#ffec55':
  s.color==='fire'?'#ff9a25':s.color;
 ctx.beginPath();
 ctx.arc(head.x,head.y,r,0,Math.PI*2);
 ctx.fill();

 let ex=Math.cos(s.angle+Math.PI/2)*r*.42;
 let ey=Math.sin(s.angle+Math.PI/2)*r*.42;

 for(let side of [-1,1]){
  let x=head.x+Math.cos(s.angle)*r*.35+ex*side;
  let y=head.y+Math.sin(s.angle)*r*.35+ey*side;
  ctx.fillStyle='white';
  ctx.beginPath();
  ctx.arc(x,y,r*.28,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#10131a';
  ctx.beginPath();
  ctx.arc(x+Math.cos(s.angle)*r*.1,
          y+Math.sin(s.angle)*r*.1,r*.13,0,Math.PI*2);
  ctx.fill();
 }

 if(camera.zoom>.4){
  ctx.font='bold 12px Arial';
  ctx.textAlign='center';
  ctx.fillStyle='white';
  ctx.fillText(s.name,head.x,head.y-r-9);
 }
}

function draw(){
 drawBackground();
 drawFood();
 for(let s of snakes)drawSnake(s);
}

function hud(){
 if(!player)return;
 document.getElementById('mass').textContent=Math.floor(player.mass);
 document.getElementById('length').textContent=player.points.length;
 document.getElementById('bots').textContent=
  snakes.filter(s=>!s.isPlayer&&s.alive).length;

 let top=[...snakes].filter(s=>s.alive)
  .sort((a,b)=>b.mass-a.mass).slice(0,5);

 document.getElementById('scores').innerHTML=top.map((s,i)=>
  `${i+1}. ${s.name} — ${Math.floor(s.mass)}`
 ).join('<br>');
}

function loop(t){
 requestAnimationFrame(loop);
 let dt=Math.min((t-last)/1000,.04);
 last=t;

 if(running&&!paused){
  update(dt);
  if(player&&player.alive){
   let auto=clamp(1.25/(1+Math.sqrt(player.mass)/30),.48,1.15);
   camera.zoom+=(auto*manualZoom-camera.zoom)*Math.min(1,dt*2.5);
  }
  hud();
 }

 draw();

 if(paused&&running){
  ctx.fillStyle='#0009';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='white';
  ctx.textAlign='center';
  ctx.font='bold 40px Arial';
  ctx.fillText('ПАУЗА',W/2,H/2);
 }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
